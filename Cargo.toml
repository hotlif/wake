# Wake — workspace 根（虚拟清单，本体无 package）
# 当前架构与依赖方向见 engineering/ARCHITECTURE.md。
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.21"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hotlif/wake"
rust-version = "1.95"

# ---------------------------------------------------------------------------
# 外部依赖白名单。编译核心（lexer/parser/transform/codegen）
# 只允许：bumpalo / rustc-hash / memchr / simdutf8 / xxhash-rust。
# 其余（dashmap/crossbeam/tokio/…）仅限引擎、缓存、dev server、CLI 使用。
# 版本在此集中管理，新增依赖需 review。
# ---------------------------------------------------------------------------
[workspace.dependencies]
# —— 编译核心白名单 ——
bumpalo = { version = "3.20.3", features = ["collections"] }
rustc-hash = "2.1.3"
memchr = "2.8.3"
simdutf8 = "0.1.5"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
cssparser = "0.37.0"

# —— 引擎 / 并发 ——
dashmap = "6.2.1"
crossbeam-deque = "0.8.7"
crossbeam-utils = "0.8.22"
# 并发正确性模型检查（仅 cfg(loom) 下的测试用）。
loom = "0.7"

# —— 过程宏（wake_turbo_macros）——
syn = { version = "3.0.3", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"

# —— 持久化 / 序列化 ——
rkyv = "0.8.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
# 声明式项目配置 wake.config.toml（仅 wake_config 使用，CLI 侧，非编译核心）。
toml = "1.1.4+spec-1.1.0"
# 组件扫描 include/exclude 正则（仅 wake_scan 使用，CLI 侧，非编译核心）。
regex = "1"
# MDX syntax trees stay in the docs edge layer; Wake still compiles JavaScript/TSX.
markdown = "1.0.0"
# Browserslist 查询只在配置边缘层使用；编译核心只接收已规范化目标。
browserslist-rs = "0.20.0"

# —— dev server / 网络（仅 wake_dev_server）——
# 仅直接启用 broadcast/select 所需能力；运行时、网络与计时能力由 Actix 依赖统一提供。
tokio = { version = "1.53.1", default-features = false, features = ["sync", "macros"] }
tower-lsp-server = "0.23.0"
# 开发服务器不使用响应压缩、Cookie、HTTP/2 或路由宏，关闭默认功能避免编译其 C/过程宏依赖。
actix-web = { version = "4.14.0", default-features = false }
actix-ws = "0.4.0"
# dev server 代理转发（forward 到后端 target），与 actix-web 4.x 配套。
awc = { version = "3", default-features = false }
notify = "8.2.0"
futures-util = "0.3"

# —— Node-API（仅 wake_node 边缘层）——
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
napi-build = "2"

# —— CLI / 分配器 ——
# CLI 已有自己的颜色策略；Clap 只保留解析、帮助和错误提示功能。
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
mimalloc = "0.1"
ctrlc = "3.5.1"
signal-hook = "0.4.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = "0.29.0"
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
base64 = "=0.22.1"
open = "=5.4.0"
unicode-segmentation = "=1.12.0"
unicode-width = "=0.2.1"

# —— 内部 crate（路径依赖）——
wake_common = { path = "crates/wake_common" }
wake_config = { path = "crates/wake_config" }
wake_scan = { path = "crates/wake_scan" }
wake_html = { path = "crates/wake_html" }
wake_turbo = { path = "crates/wake_turbo" }
wake_turbo_macros = { path = "crates/wake_turbo_macros" }
wake_ecma_ast = { path = "crates/wake_ecma_ast" }
wake_ecma_lexer = { path = "crates/wake_ecma_lexer" }
wake_ecma_semantic = { path = "crates/wake_ecma_semantic" }
wake_ecma_parser = { path = "crates/wake_ecma_parser" }
wake_ecma_transform = { path = "crates/wake_ecma_transform" }
wake_ecma_codegen = { path = "crates/wake_ecma_codegen" }
wake_ecma_minify = { path = "crates/wake_ecma_minify" }
wake_resolver = { path = "crates/wake_resolver" }
wake_graph = { path = "crates/wake_graph" }
wake_bundler = { path = "crates/wake_bundler" }
wake_css = { path = "crates/wake_css" }
wake_css_in_js = { path = "crates/wake_css_in_js" }
wake_css_language = { path = "crates/wake_css_language" }
wake_css_lsp = { path = "crates/wake_css_lsp" }
wake_cache = { path = "crates/wake_cache" }
wake_dev_server = { path = "crates/wake_dev_server" }
wake_docs = { path = "crates/wake_docs" }
wake_tsdoc = { path = "crates/wake_tsdoc" }
wake_app = { path = "crates/wake_app" }

# —— 测试 / 基准（dev-dependencies 复用）——
insta = "1.48.0"
criterion = "0.8.2"

[workspace.lints.rust]
# `loom` 是 wake_turbo 并发验证用的自定义 cfg（仅 `--cfg loom` 下编译 loom 测试）。
# 向 check-cfg 声明，避免 Rust 1.80+ 的 unexpected_cfgs lint 在 `-D warnings` 下报错。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
# CI 门禁：clippy -D warnings。此处仅放宽个别噪音 lint。
too_many_arguments = "allow"

# ---------------------------------------------------------------------------
# dev profile：迭代速度优先。Windows MSVC 的增量链接耗时几乎全花在调试信息（PDB）上——
# 把 `debug` 从默认的 `2`（完整）降到 `line-tables-only`（仅行号表）后，改一个文件的增量
# 重链接从 ~7.3s 降到 ~2.3s（实测，本机 15-crate + tokio/actix），且仍保留 backtrace 的
# `文件:行号`。要完整变量调试信息时临时 `CARGO_PROFILE_DEV_DEBUG=2 cargo build` 即可。
# （stable 上 msvc 用不了内置 rust-lld——需 nightly `-Z unstable-options`——故走减调试信息路线。）
# ---------------------------------------------------------------------------
[profile.dev]
debug = "line-tables-only"

# ---------------------------------------------------------------------------
# 发布 profile。基准稳定后再评估 fat LTO + codegen-units=1 + PGO + BOLT。
# 目前保持 thin LTO，兼顾产物质量与迭代速度。
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "thin"
# codegen-units = 1   # P7 开启（编译慢，迭代期先不开）
# panic = "abort"     # P7 开启（需同步处理 fuzz/test 的 unwind 需求）

[profile.bench]
opt-level = 3
lto = "thin"

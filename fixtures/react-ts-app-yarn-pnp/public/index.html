<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wake · TypeScript + React 19 + lodash</title>
    <!--
      不再需要 `process` shim：wake 已在 codegen 做 define 替换，
      把 process.env.NODE_ENV 编译期替换为 "production"。
    -->
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: system-ui, "Segoe UI", sans-serif;
        background: #0f1117;
        color: #e6e6e6;
        display: flex;
        justify-content: center;
        padding: 40px 16px;
      }
      .app { width: 100%; max-width: 560px; }
      h1 { font-size: 20px; font-weight: 700; margin: 0 0 20px; color: #7dd3fc; }
      .card {
        background: #171a23;
        border: 1px solid #262b38;
        border-radius: 12px;
        padding: 18px 20px;
        margin-bottom: 16px;
      }
      .card h2 { margin: 0 0 8px; font-size: 16px; }
      .card p { margin: 0 0 12px; color: #9aa4b2; line-height: 1.5; }
      .tags { display: flex; gap: 8px; flex-wrap: wrap; }
      .tag {
        font-size: 12px;
        background: #1e2a3a;
        color: #7dd3fc;
        padding: 3px 10px;
        border-radius: 999px;
      }
      .stats { list-style: none; padding: 0; margin: 0 0 16px; display: flex; gap: 10px; flex-wrap: wrap; }
      .stats li {
        background: #171a23;
        border: 1px solid #262b38;
        border-radius: 8px;
        padding: 8px 14px;
        font-variant-numeric: tabular-nums;
      }
      .counter { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
      .counter button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      .counter button:hover { background: #1d4ed8; }
      .count { font-variant-numeric: tabular-nums; }
      .meta { font-size: 12px; color: #6b7280; line-height: 1.6; word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./bundle.js"></script>
  </body>
</html>

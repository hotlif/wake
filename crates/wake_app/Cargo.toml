[package]
name = "wake_app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Reusable Wake application services shared by CLI and Node-API"

[lints]
workspace = true

[dependencies]
wake_common.workspace = true
wake_config.workspace = true
wake_scan.workspace = true
wake_html.workspace = true
wake_bundler.workspace = true
wake_resolver.workspace = true
wake_dev_server.workspace = true
wake_docs.workspace = true
wake_tsdoc.workspace = true
wake_ecma_transform.workspace = true
wake_test_contract.workspace = true
wake_federation_contract.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
same-file.workspace = true
toml = { workspace = true, features = ["preserve_order"] }
regex.workspace = true
getrandom.workspace = true
base64.workspace = true
ring.workspace = true
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

name: CI

# 工程基线：每 PR 跑 fmt + clippy(-D warnings) + test + miri；bench 先做编译冒烟，
# 回归门禁（超 5% 红灯）待有基线历史后接入 critcmp。

on:
  push:
    branches: [canary]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  yarn-pnp:
    name: Yarn PnP provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      - run: corepack yarn yarn:lock:check
      - run: corepack yarn pnp:conformance:check

  npm-package-artifacts:
    name: npm package artifacts / ${{ matrix.platform }}
    needs: yarn-pnp
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            package_dir: wake-win32-x64-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            package_dir: wake-linux-x64-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
        with:
          key: npm-package-${{ matrix.target }}
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      # napi build evaluates the complete locked Cargo graph before its offline build.
      - run: cargo fetch --locked
      - run: node scripts/prepare-rusty-v8.mjs --target ${{ matrix.target }}
      - run: corepack yarn native:build
        env:
          CARGO_NET_OFFLINE: "true"
      - run: git diff --exit-code -- Cargo.lock
      - name: Stage matching npm platform package
        run: node scripts/stage-test-host.mjs --package-dir npm/${{ matrix.package_dir }}
      - run: node -e "require('node:fs').mkdirSync('artifacts', {recursive:true})"
      - run: corepack yarn npm:pack:check
        env:
          WAKE_PACK_TARGETS: npm/css,npm/wake,npm/${{ matrix.package_dir }}
      - run: npm pack ./npm/wake --ignore-scripts --pack-destination artifacts
      - run: npm pack ./npm/css --ignore-scripts --pack-destination artifacts
      - run: npm pack ./npm/${{ matrix.package_dir }} --ignore-scripts --pack-destination artifacts
      - name: Pack non-host platform metadata for npm lock generation
        run: node scripts/pack-npm-lock-platforms.mjs --artifacts artifacts --exclude ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-consumer-${{ matrix.platform }}
          path: artifacts/*.tgz
          if-no-files-found: error

  npm-consumer:
    name: npm consumer / ${{ matrix.platform }} / Node ${{ matrix.node }}
    needs: npm-package-artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64-msvc
            node: '22.14.0'
          - os: windows-latest
            platform: win32-x64-msvc
            node: '26'
          - os: ubuntu-latest
            platform: linux-x64-gnu
            node: '22.14.0'
          - os: ubuntu-latest
            platform: linux-x64-gnu
            node: '26'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: npm-consumer-${{ matrix.platform }}
          path: artifacts
      - name: Clean npm ci consumer outside the PnP source tree
        run: node scripts/check-npm-consumer.mjs
        env:
          WAKE_NPM_ARTIFACTS: ${{ github.workspace }}/artifacts
          WAKE_NPM_PLATFORM: ${{ matrix.platform }}
          WAKE_NPM_PROJECT: ${{ runner.temp }}/wake-npm-consumer

  architecture:
    name: architecture boundaries
    needs: yarn-pnp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: architecture
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      # The architecture checker runs `cargo tree --target all --offline`; fetch the
      # complete locked graph before preparing only the Linux rusty_v8 archive.
      - run: cargo fetch --locked
      - run: node scripts/prepare-rusty-v8.mjs --target x86_64-unknown-linux-gnu
      - run: cargo build -p wake_test_host -p wake_cli --locked --offline
        env:
          CARGO_NET_OFFLINE: "true"
      - run: corepack yarn release:check
      - run: ./target/debug/wake test scripts/check-architecture.test.mjs --serial
      - run: corepack yarn architecture:check

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy -D warnings
    needs: yarn-pnp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      - run: cargo fetch --locked --target x86_64-unknown-linux-gnu
      - run: node scripts/prepare-rusty-v8.mjs --target x86_64-unknown-linux-gnu
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
        env:
          CARGO_NET_OFFLINE: "true"

  test:
    name: test
    needs: yarn-pnp
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      - run: cargo fetch --locked --target ${{ matrix.target }}
      - run: node scripts/prepare-rusty-v8.mjs --target ${{ matrix.target }}
      - run: cargo test --workspace --locked --offline
        env:
          CARGO_NET_OFFLINE: "true"

  test262-es2024:
    name: selected Test262 ES2024 / embedded V8
    needs: yarn-pnp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: test262-es2024
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      - run: cargo fetch --locked --target x86_64-unknown-linux-gnu
      - run: node scripts/prepare-rusty-v8.mjs --target x86_64-unknown-linux-gnu
      - run: corepack yarn test262:es2024
        env:
          CARGO_NET_OFFLINE: "true"

  browser-conformance:
    name: Browser evidence / ${{ matrix.target }} / ${{ matrix.browser_evidence }}
    needs: yarn-pnp
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64-msvc
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            browser_evidence: exact-major-conformance
            browser_major: 151
          - target: linux-x64-gnu
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            browser_evidence: exact-major-conformance
            browser_major: 151
          - target: linux-arm64-gnu
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            browser_evidence: unavailable
          - target: darwin-arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
            browser_evidence: exact-major-smoke
            browser_major: 150
          - target: darwin-x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            browser_evidence: reviewed-major-smoke
            browser_majors: '150,151'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.95.0
        if: matrix.browser_evidence != 'unavailable'
      - uses: Swatinem/rust-cache@v2
        if: matrix.browser_evidence != 'unavailable'
        with:
          key: browser-${{ matrix.target }}
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      - run: corepack yarn browser:conformance:test
      - name: Record reviewed browser unavailability
        if: matrix.browser_evidence == 'unavailable'
        shell: bash
        run: |
          node scripts/check-system-browser-conformance.mjs \
            --target "${{ matrix.target }}" \
            --unavailable true > "$RUNNER_TEMP/wake-browser-evidence.json"
      - if: matrix.browser_evidence != 'unavailable'
        run: cargo fetch --locked --target ${{ matrix.rust_target }}
      - if: matrix.browser_evidence != 'unavailable'
        run: node scripts/prepare-rusty-v8.mjs --target ${{ matrix.rust_target }}
      - name: Require the reviewed post-CDP system browser identity
        if: matrix.browser_evidence != 'unavailable'
        shell: bash
        run: |
          set -euo pipefail
          identity="$RUNNER_TEMP/wake-system-browser.json"
          cargo run --locked --offline --quiet -p wake_test_browser --example system_browser_identity > "$identity"
          node scripts/check-system-browser-conformance.mjs \
            --target "${{ matrix.target }}" \
            --identity "$identity" > "$RUNNER_TEMP/wake-browser-evidence.json"
        env:
          CARGO_NET_OFFLINE: "true"
      - name: CDP transport against the installed system browser
        if: matrix.browser_evidence != 'unavailable'
        run: cargo test --locked --offline -p wake_test_browser --lib -- --ignored --nocapture --test-threads=1
        env:
          CARGO_NET_OFFLINE: "true"
      - name: React, input, source-map and screenshot conformance
        if: matrix.browser_evidence != 'unavailable'
        run: cargo test --locked --offline -p wake_test --lib -- --ignored --nocapture --test-threads=1
        env:
          CARGO_NET_OFFLINE: "true"
      - name: Browser TSX V8 coverage reports and thresholds
        if: matrix.browser_evidence != 'unavailable'
        run: cargo test --locked --offline -p wake_test --test browser_coverage_conformance -- --ignored --nocapture
        env:
          CARGO_NET_OFFLINE: "true"
      - name: Upload reviewed browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-ci-${{ matrix.target }}
          path: ${{ runner.temp }}/wake-browser-evidence.json
          if-no-files-found: error

  browser-stable-readiness:
    name: Stable browser readiness (expected blocked)
    needs: browser-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prove five-target shared exact-major readiness is blocked
        shell: bash
        run: |
          node scripts/check-system-browser-conformance.mjs \
            --stable-readiness blocked > "$RUNNER_TEMP/wake-browser-stable-readiness.json"
      - name: Upload stable readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: browser-stable-readiness-ci
          path: ${{ runner.temp }}/wake-browser-stable-readiness.json
          if-no-files-found: error

  typescript-7:
    name: TypeScript 7 compatibility / ${{ matrix.os }}
    needs: yarn-pnp
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      - run: corepack yarn typescript:7:check

  miri:
    name: miri (手写 unsafe 内存模型)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # 自引用 AST 持有者含手写 unsafe，必须常驻 miri 防回归。
      - run: cargo miri test -p wake_ecma_ast
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
      # wake_turbo 引擎核心：engine.rs 的 thread-local 裸指针 unsafe + 红绿对拍，默认 Stacked Borrows。
      # executor/concurrent 测试用 crossbeam（SB 下有已知假阳性、~11min），已 #[cfg_attr(miri, ignore)]
      # 自动跳过——并发正确性归下方 loom job。
      - run: cargo miri test -p wake_turbo
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  loom:
    name: loom (single-flight 并发协议)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      # 穷举线程交错验证 single-flight 协议（tests/loom_single_flight.rs）。
      # --cfg loom 下执行器/crossbeam 被排除（见 Cargo.toml），只编译引擎核心 + loom。
      - run: cargo test -p wake_turbo --test loom_single_flight
        env:
          RUSTFLAGS: --cfg loom

  bench-smoke:
    name: performance invariants + benches compile
    needs: yarn-pnp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      - run: cargo fetch --locked --target x86_64-unknown-linux-gnu
      - run: node scripts/prepare-rusty-v8.mjs --target x86_64-unknown-linux-gnu
      # Shared runners are too noisy for a millisecond SLA. Gate deterministic avoided-work counts,
      # then compile Criterion benches so measurement surfaces cannot silently rot.
      - run: cargo test --locked --offline -p wake_bundler --test performance_invariants --release
        env:
          CARGO_NET_OFFLINE: "true"
      - run: cargo bench --workspace --locked --offline --no-run
        env:
          CARGO_NET_OFFLINE: "true"

  docs:
    name: documentation
    needs: yarn-pnp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      - run: corepack yarn docs:check
      - run: corepack yarn docs:build

  css:
    name: css package
    needs: yarn-pnp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: css
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      - run: cargo fetch --locked --target x86_64-unknown-linux-gnu
      - run: node scripts/prepare-rusty-v8.mjs --target x86_64-unknown-linux-gnu
      - run: cargo build -p wake_test_host -p wake_cli --locked --offline
        env:
          CARGO_NET_OFFLINE: "true"
      - run: ./target/debug/wake test npm/css/test/runtime.test.mjs --serial
      - run: node --test npm/css/test/realm.node.mjs
      - run: corepack yarn npm:typecheck:css
      - run: corepack yarn npm:pack:check
        env:
          WAKE_PACK_TARGETS: npm/css

  node:
    name: node ${{ matrix.node }} / win32-x64
    needs: yarn-pnp
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: node-${{ matrix.node }}
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      # napi build invokes offline cargo metadata across the complete locked graph.
      - run: cargo fetch --locked
      - run: node scripts/prepare-rusty-v8.mjs --target x86_64-pc-windows-msvc
      - run: corepack yarn versions:check
      - run: corepack yarn native:build
        env:
          CARGO_NET_OFFLINE: "true"
      - run: git diff --exit-code -- Cargo.lock
      - run: node scripts/stage-test-host.mjs --package-dir npm/wake-win32-x64-msvc
      - name: Select local native binding
        shell: pwsh
        run: |
          "WAKE_NATIVE_PATH=$((Resolve-Path npm/wake/wake.win32-x64-msvc.node).Path)" >> $env:GITHUB_ENV
      - run: corepack yarn npm:test:wake
      - run: corepack yarn npm:typecheck:wake
      - run: node scripts/check-startup.mjs
      - run: corepack yarn npm:pack:check
        env:
          WAKE_PACK_TARGETS: npm/css,npm/wake,npm/wake-win32-x64-msvc
      - name: Verify Components under Yarn PnP
        if: matrix.node == 24
        run: corepack yarn pnp:components:check

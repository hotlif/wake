name: Release npm packages

on:
  push:
    tags:
      - 'v*'
      - '!vscode-css-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.version }}
      source_date_epoch: ${{ steps.source-date.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      - run: corepack yarn yarn:lock:check
      - run: corepack yarn pnp:conformance:check
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --target x86_64-unknown-linux-gnu
      - name: Verify pinned Rusty V8 input
        run: node scripts/prepare-rusty-v8.mjs --target x86_64-unknown-linux-gnu
      - name: Read package version
        id: package-version
        shell: bash
        run: |
          version="$(node -p 'require("./npm/wake/package.json").version')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Read reproducible source date
        id: source-date
        shell: bash
        run: printf 'epoch=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - run: corepack yarn versions:check
      - run: corepack yarn browser:conformance:test
      - run: corepack yarn release:check
      - run: corepack yarn npm:test:wake:federation
      - run: corepack yarn npm:typecheck:wake
      - run: corepack yarn npm:typecheck:css
      - run: corepack yarn npm:pack:check
        env:
          WAKE_PACK_TARGETS: npm/css,npm/wake
      - name: Test and build from verified inputs
        run: |
          cargo test --workspace --locked --offline
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          cargo build -p wake_test_host -p wake_cli --locked --offline
        env:
          CARGO_NET_OFFLINE: "true"
      - name: Test CSS with this build's Wake Test host
        run: ./target/debug/wake test npm/css/test/runtime.test.mjs --serial
      - name: Test the explicit Node realm boundary
        run: node --test npm/css/test/realm.node.mjs
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  build-native:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win32-x64-msvc
            package_dir: wake-win32-x64-msvc
            host_binary: wake-test-host.exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: darwin-x64
            package_dir: wake-darwin-x64
            host_binary: wake-test-host
          - runner: macos-15
            target: aarch64-apple-darwin
            suffix: darwin-arm64
            package_dir: wake-darwin-arm64
            host_binary: wake-test-host
    runs-on: ${{ matrix.runner }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      - name: Fetch locked Rust dependencies
        # napi build runs offline cargo metadata for the complete locked graph.
        run: cargo fetch --locked
      - name: Verify pinned Rusty V8 input
        run: node scripts/prepare-rusty-v8.mjs --target ${{ matrix.target }}
      - run: cargo build -p wake_test_host --release --locked --offline --target ${{ matrix.target }}
        env:
          CARGO_NET_OFFLINE: "true"
      - run: >-
          corepack yarn exec napi build --platform --release --strip
          --cwd crates/wake_node
          --output-dir ../../npm/wake
          --package-json-path ../../npm/wake/package.json
          --no-js --dts native.d.ts
          --target ${{ matrix.target }}
          -- --locked --offline
        env:
          CARGO_NET_OFFLINE: "true"
      - run: git diff --exit-code -- Cargo.lock
      - name: Stage platform package
        run: >-
          node scripts/stage-test-host.mjs
          --package-dir npm/${{ matrix.package_dir }}
          --target ${{ matrix.target }}
          --suffix ${{ matrix.suffix }}
          --binding npm/wake/wake.${{ matrix.suffix }}.node
          --host target/${{ matrix.target }}/release/${{ matrix.host_binary }}
      - name: Verify Components under Yarn PnP
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $env:WAKE_NATIVE_PATH = (Resolve-Path npm/wake/wake.win32-x64-msvc.node).Path
          corepack yarn pnp:components:check
      - run: node -e "require('node:fs').mkdirSync('artifacts', {recursive:true})"
      - run: corepack yarn npm:pack:check
        env:
          WAKE_PACK_TARGETS: npm/${{ matrix.package_dir }}
      - run: npm pack ./npm/${{ matrix.package_dir }} --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.suffix }}
          path: artifacts/*.tgz
          if-no-files-found: error

  build-linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
            package_dir: wake-linux-x64-gnu
            host_binary: wake-test-host
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64-gnu
            package_dir: wake-linux-arm64-gnu
            host_binary: wake-test-host
    runs-on: ${{ matrix.runner }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.source_date_epoch }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      - name: Fetch locked Rust dependencies
        # napi build runs offline cargo metadata for the complete locked graph.
        run: cargo fetch --locked
      - name: Verify pinned Rusty V8 input
        run: node scripts/prepare-rusty-v8.mjs --target ${{ matrix.target }}
      - name: Snapshot locked dependency graph
        run: cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
      - run: cargo build -p wake_test_host --release --locked --offline --target ${{ matrix.target }}
        env:
          CARGO_NET_OFFLINE: "true"
      - run: >-
          corepack yarn exec napi build --platform --release --strip
          --cwd crates/wake_node
          --output-dir ../../npm/wake
          --package-json-path ../../npm/wake/package.json
          --no-js --dts native.d.ts
          --target ${{ matrix.target }}
          -- --locked --offline
        env:
          CARGO_NET_OFFLINE: "true"
      - name: Verify locked dependency graph stayed unchanged
        run: cmp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
      - name: Verify glibc baseline
        run: |
          highest="$(readelf --version-info npm/wake/wake.${{ matrix.suffix }}.node | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          test "$(printf '%s\n' "$highest" 'GLIBC_2.28' | sort -V | tail -1)" = 'GLIBC_2.28'
          highest_host="$(readelf --version-info target/${{ matrix.target }}/release/${{ matrix.host_binary }} | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          test "$(printf '%s\n' "$highest_host" 'GLIBC_2.28' | sort -V | tail -1)" = 'GLIBC_2.28'
      - name: Run native binding on glibc 2.28
        run: WAKE_NATIVE_PATH="$PWD/npm/wake/wake.${{ matrix.suffix }}.node" node -e "console.log(require(process.env.WAKE_NATIVE_PATH).version())"
      - name: Stage platform package
        run: >-
          node scripts/stage-test-host.mjs
          --package-dir npm/${{ matrix.package_dir }}
          --target ${{ matrix.target }}
          --suffix ${{ matrix.suffix }}
          --binding npm/wake/wake.${{ matrix.suffix }}.node
          --host target/${{ matrix.target }}/release/${{ matrix.host_binary }}
      - run: mkdir -p artifacts
      - run: node -e "require('node:fs').mkdirSync('artifacts', {recursive:true})"
      - run: corepack yarn npm:pack:check
        env:
          WAKE_PACK_TARGETS: npm/${{ matrix.package_dir }}
      - run: npm pack ./npm/${{ matrix.package_dir }} --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.suffix }}
          path: artifacts/*.tgz
          if-no-files-found: error

  pack-root:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      - run: mkdir -p artifacts
      - run: corepack yarn npm:pack:check
        env:
          WAKE_PACK_TARGETS: npm/css,npm/wake
      - run: npm pack ./npm/wake --ignore-scripts --pack-destination artifacts
      - run: npm pack ./npm/css --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-javascript
          path: artifacts/*.tgz
          if-no-files-found: error

  audit-tarballs:
    needs: [verify, build-native, build-linux, pack-root]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global corepack@0.34.6 --force
      - run: corepack yarn install --immutable --check-cache
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: artifacts
          merge-multiple: true
      - name: Verify all immutable tarballs
        shell: bash
        run: |
          expected_version='${{ needs.verify.outputs.version }}'
          expected_names=(
            '@crab-dev/css'
            '@crab-dev/wake'
            '@crab-dev/wake-win32-x64-msvc'
            '@crab-dev/wake-linux-x64-gnu'
            '@crab-dev/wake-linux-arm64-gnu'
            '@crab-dev/wake-darwin-x64'
            '@crab-dev/wake-darwin-arm64'
          )
          declare -A seen=()
          shopt -s nullglob
          archives=(artifacts/*.tgz)
          test "${#archives[@]}" -eq "${#expected_names[@]}"
          for archive in "${archives[@]}"; do
            list="$(tar -tzf "$archive")"
            grep -qx 'package/package.json' <<<"$list"
            grep -qx 'package/LICENSE-MIT' <<<"$list"
            grep -qx 'package/LICENSE-APACHE' <<<"$list"
            grep -qx 'package/README.md' <<<"$list"
            name="$(tar -xOzf "$archive" package/package.json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>process.stdout.write(JSON.parse(s).name))")"
            version="$(tar -xOzf "$archive" package/package.json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
            test "$version" = "$expected_version"
            test -z "${seen[$name]:-}"
            seen["$name"]=1
            native_count="$(grep -Ec '\.node$' <<<"$list" || true)"
            case "$name" in
              '@crab-dev/css')
                test "$native_count" -eq 0
                test "$(stat -c%s "$archive")" -le 131072
                grep -qx 'package/index.cjs' <<<"$list"
                grep -qx 'package/index.mjs' <<<"$list"
                grep -qx 'package/index.d.ts' <<<"$list"
                ;;
              '@crab-dev/wake')
                test "$native_count" -eq 0
                test "$(stat -c%s "$archive")" -le 524288
                for required in \
                  bin/wake.mjs \
                  index.cjs index.mjs index.d.ts \
                  experimental.cjs experimental.mjs experimental.d.ts \
                  federation.mjs federation.d.mts \
                  federation-react.mjs federation-react.d.ts \
                  test.cjs test.mjs test.d.ts \
                  test-react.cjs test-react.mjs test-react.d.ts \
                  internal/components-runtime.mjs internal/components-runtime.d.ts; do
                  grep -qx "package/$required" <<<"$list"
                done
                ;;
              '@crab-dev/wake-'*)
                test "$native_count" -eq 1
                packed_size="$(stat -c%s "$archive")"
                test "$packed_size" -le 67108864
                if test "$packed_size" -gt 58720256; then
                  echo "::warning file=$archive::Platform package is above the 56 MiB packed warning threshold ($packed_size bytes)"
                fi
                archive_details="$(tar -tvzf "$archive")"
                unpacked_size="$(awk '{total += $3} END {print total + 0}' <<<"$archive_details")"
                test "$unpacked_size" -le 201326592
                host_count="$(grep -Ec 'package/test-host/wake-test-host(\.exe)?$' <<<"$list" || true)"
                test "$host_count" -eq 1
                if [[ "$name" != *win32* ]]; then
                  grep -Eq '^-..x..x..x .*package/test-host/wake-test-host$' <<<"$archive_details"
                fi
                grep -qx 'package/native-manifest.json' <<<"$list"
                grep -qx 'package/sbom.spdx.json' <<<"$list"
                grep -qx 'package/THIRD_PARTY_LICENSES.txt' <<<"$list"
                unexpected="$(grep -Ev '^package/(LICENSE-APACHE|LICENSE-MIT|README\.md|THIRD_PARTY_LICENSES\.txt|native-manifest\.json|package\.json|sbom\.spdx\.json|wake\.[^/]+\.node|test-host/wake-test-host(\.exe)?)$' <<<"$list" || true)"
                test -z "$unexpected"
                extracted="$(mktemp -d)"
                tar -xzf "$archive" -C "$extracted"
                node scripts/verify-native-package.mjs "$extracted/package"
                ;;
              *)
                echo "Unexpected npm package: $name" >&2
                exit 1
                ;;
            esac
          done
          for expected_name in "${expected_names[@]}"; do
            test "${seen[$expected_name]:-}" = 1
          done
      - uses: actions/attest-build-provenance@v3
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: artifacts/*.tgz

  prepublish-smoke:
    needs: [verify, audit-tarballs]
    strategy:
      fail-fast: false
      matrix:
        platform: [win32-x64-msvc, linux-x64-gnu, linux-arm64-gnu, darwin-x64, darwin-arm64]
        node: ['22.14.0', '24', '26']
        include:
          - platform: win32-x64-msvc
            runner: windows-latest
            browser_evidence: exact-major-conformance
            browser_major: 151
            browser_path: 'C:/Program Files/Google/Chrome/Application/chrome.exe'
          - platform: linux-x64-gnu
            runner: ubuntu-24.04
            browser_evidence: exact-major-conformance
            browser_major: 151
            browser_path: /usr/bin/google-chrome
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            browser_evidence: unavailable
          - platform: darwin-x64
            runner: macos-15-intel
            browser_evidence: reviewed-major-smoke
            browser_majors: '150,151'
            browser_path: '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          - platform: darwin-arm64
            runner: macos-15
            browser_evidence: exact-major-smoke
            browser_major: 150
            browser_path: '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
    runs-on: ${{ matrix.runner }}
    env:
      WAKE_NPM_ARTIFACTS: ${{ github.workspace }}/artifacts
      WAKE_NPM_PLATFORM: ${{ matrix.platform }}
      WAKE_NPM_VERSION: ${{ needs.verify.outputs.version }}
      WAKE_RELEASE_BROWSER_PATH: ${{ matrix.browser_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Select external npm consumer project
        shell: bash
        run: printf 'WAKE_NPM_PROJECT=%s\n' "$RUNNER_TEMP/wake-npm-consumer" >> "$GITHUB_ENV"
      - name: Clean install this build's local tarballs
        run: node scripts/check-npm-consumer.mjs
      - name: Wake Test CLI, runTests and TestContext smoke
        shell: bash
        run: |
          set -euo pipefail
          cd "$WAKE_NPM_PROJECT"
          node node_modules/@crab-dev/wake/bin/wake.mjs test smoke.test.mjs --serial
          node <<'NODE'
          const { createTestContext, runTests } = require('@crab-dev/wake')
          async function main() {
            const options = { root: process.cwd(), patterns: ['smoke.test.mjs'], serial: true }
            const direct = await runTests(options)
            if (!direct.success || direct.counts.tests.passed !== 1) {
              throw new Error(`runTests smoke failed: ${JSON.stringify(direct)}`)
            }
            const context = await createTestContext(options)
            const events = []
            context.on('runStart', event => events.push(event.watching ? 'watchRunStart' : 'runStart'))
            context.on('runComplete', () => events.push('runComplete'))
            context.on('closed', () => events.push('closed'))
            try {
              const result = await context.run()
              if (!result.success || result.counts.tests.passed !== 1) {
                throw new Error(`TestContext smoke failed: ${JSON.stringify(result)}`)
              }
              const watchComplete = new Promise((resolve, reject) => {
                const timeout = setTimeout(
                  () => reject(new Error('TestContext watch run did not complete within 10 seconds')),
                  10_000,
                )
                context.once('runComplete', watchResult => {
                  clearTimeout(timeout)
                  resolve(watchResult)
                })
              })
              context.startWatch()
              if (!context.watching) throw new Error('TestContext did not enter watch mode')
              const watchResult = await watchComplete
              if (!watchResult.success || watchResult.counts.tests.passed !== 1) {
                throw new Error(`TestContext watch smoke failed: ${JSON.stringify(watchResult)}`)
              }
              context.stopWatch()
              if (context.watching) throw new Error('TestContext did not leave watch mode')
            } finally {
              await context.close()
            }
            const watchEvents = events.slice(2, -1)
            const watchLifecycleValid = watchEvents.length >= 2
              && watchEvents.length % 2 === 0
              && watchEvents.every((event, index) =>
                event === (index % 2 === 0 ? 'watchRunStart' : 'runComplete'))
            if (!context.closed
              || events[0] !== 'runStart'
              || events[1] !== 'runComplete'
              || events.at(-1) !== 'closed'
              || !watchLifecycleValid) {
              throw new Error(`TestContext lifecycle mismatch: closed=${context.closed}; events=${events.join(',')}`)
            }
          }
          main().catch(error => {
            console.error(error)
            process.exitCode = 1
          })
          NODE
      - name: Select a system Chrome, Edge or Chromium
        if: matrix.node == '24' && matrix.browser_evidence != 'unavailable'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$WAKE_RELEASE_BROWSER_PATH" ]]; then
            echo "::error::Reviewed system browser is unavailable at $WAKE_RELEASE_BROWSER_PATH on $RUNNER_OS/$RUNNER_ARCH"
            exit 1
          fi
          printf 'Using reviewed system browser: %s\n' "$WAKE_RELEASE_BROWSER_PATH"
      - name: React browser and screenshot smoke from local tarballs
        if: matrix.node == '24' && matrix.browser_evidence != 'unavailable'
        shell: bash
        run: |
          set -euo pipefail
          cd "$WAKE_NPM_PROJECT"
          node -e "require('node:fs').writeFileSync('visual.browser.test.mjs',\"import React from 'react';import {test,expect} from '@crab-dev/wake/test';import {render,screen} from '@crab-dev/wake/test/react';test('local browser runtime',async()=>{await render(React.createElement('button',{'aria-label':'Ready',style:{width:120,height:48}},'Ready'));expect(screen.getByRole('button',{name:'Ready'}).textContent).toBe('Ready');await expect(screen.getByRole('button',{name:'Ready'})).toMatchScreenshot('local-ready')})\\n\")"
          node node_modules/@crab-dev/wake/bin/wake.mjs test visual.browser.test.mjs \
            --serial \
            --browser-path "$WAKE_RELEASE_BROWSER_PATH" \
            --reporter json \
            --output browser-result.json
          node "$GITHUB_WORKSPACE/scripts/check-system-browser-conformance.mjs" \
            --target "${{ matrix.platform }}" \
            --result browser-result.json > "$RUNNER_TEMP/wake-browser-evidence.json"
          node node_modules/@crab-dev/wake/bin/wake.mjs test visual.browser.test.mjs --serial --browser-path "$WAKE_RELEASE_BROWSER_PATH"
      - name: Record reviewed browser unavailability
        if: matrix.node == '24' && matrix.browser_evidence == 'unavailable'
        shell: bash
        run: |
          node scripts/check-system-browser-conformance.mjs \
            --target "${{ matrix.platform }}" \
            --unavailable true > "$RUNNER_TEMP/wake-browser-evidence.json"
      - name: Prove stable browser readiness remains blocked
        if: matrix.node == '24'
        shell: bash
        run: |
          node scripts/check-system-browser-conformance.mjs \
            --stable-readiness blocked > "$RUNNER_TEMP/wake-browser-stable-readiness.json"
      - name: Upload prepublish browser evidence
        if: matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-prepublish-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/wake-browser-evidence.json
            ${{ runner.temp }}/wake-browser-stable-readiness.json
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag' && github.ref_name == format('v{0}', needs.verify.outputs.version)
    needs: [verify, audit-tarballs, prepublish-smoke]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.verify.outputs.version }}
    environment: npm-release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - name: Publish platform packages first
        run: |
          for package in artifacts/*wake-{win32,linux,darwin}-*.tgz; do
            npm publish "./$package" --access public --provenance=${{ github.event.repository.visibility == 'public' }}
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish CSS package
        run: npm publish "./artifacts/crab-dev-css-${{ needs.verify.outputs.version }}.tgz" --access public --provenance=${{ github.event.repository.visibility == 'public' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish root package last
        run: npm publish "./artifacts/crab-dev-wake-${{ needs.verify.outputs.version }}.tgz" --access public --provenance=${{ github.event.repository.visibility == 'public' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke-glibc-228:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Clean install on the minimum glibc baseline
        shell: bash
        env:
          WAKE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          mkdir smoke
          cd smoke
          npm init -y
          for attempt in {1..12}; do
            if npm install --ignore-scripts --prefer-online "@crab-dev/wake@${WAKE_VERSION}" "@crab-dev/css@${WAKE_VERSION}"; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              exit 1
            fi
            echo "npm package is not visible yet; retrying in 30 seconds"
            sleep 30
          done
          npx wake --version
          node -e "console.log(require('@crab-dev/wake').version())"
          node -e "require('node:fs').writeFileSync('smoke.test.mjs',\"import {test,expect} from '@crab-dev/wake/test';test('native host',()=>expect(42).toBe(42))\\n\")"
          npx wake test smoke.test.mjs --serial

  smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        platform: [win32-x64-msvc, linux-x64-gnu, linux-arm64-gnu, darwin-x64, darwin-arm64]
        node: ['22.14.0', 24, 26]
        include:
          - platform: win32-x64-msvc
            runner: windows-latest
            browser_evidence: exact-major-conformance
            browser_major: 151
            browser_path: 'C:/Program Files/Google/Chrome/Application/chrome.exe'
          - platform: linux-x64-gnu
            runner: ubuntu-24.04
            browser_evidence: exact-major-conformance
            browser_major: 151
            browser_path: /usr/bin/google-chrome
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            browser_evidence: unavailable
          - platform: darwin-x64
            runner: macos-15-intel
            browser_evidence: reviewed-major-smoke
            browser_majors: '150,151'
            browser_path: '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          - platform: darwin-arm64
            runner: macos-15
            browser_evidence: exact-major-smoke
            browser_major: 150
            browser_path: '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
    runs-on: ${{ matrix.runner }}
    env:
      WAKE_RELEASE_BROWSER_PATH: ${{ matrix.browser_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
      - name: Clean registry install without build tools
        shell: bash
        env:
          WAKE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          mkdir smoke
          cd smoke
          npm init -y
          for attempt in {1..12}; do
            if npm install --ignore-scripts --prefer-online "@crab-dev/wake@${WAKE_VERSION}" "@crab-dev/css@${WAKE_VERSION}"; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              exit 1
            fi
            echo "npm package is not visible yet; retrying in 30 seconds"
            sleep 30
          done
          node -e "let p=require('./package.json');p.scripts={'wake-smoke':'wake build'};require('node:fs').writeFileSync('package.json',JSON.stringify(p));require('node:fs').mkdirSync('src');require('node:fs').writeFileSync('wake.config.toml','[html]\nentry = \"src/index.js\"\n');require('node:fs').writeFileSync('src/index.js','export const value = 42\n')"
          npx @crab-dev/wake --version
          npx wake --version
          node -e "const css=require('@crab-dev/css');if(css.cx('wake',{css:true})!=='wake css')process.exit(1)"
          npm run wake-smoke
          node -e "require('@crab-dev/wake').build({cwd:process.cwd()}).then(r=>{if(!r.success)process.exitCode=1})"
          node -e "require('node:fs').writeFileSync('smoke.test.mjs',\"import {test,expect} from '@crab-dev/wake/test';test('native host',()=>expect(42).toBe(42))\\n\")"
          npx wake test smoke.test.mjs --serial
          node -e "require('@crab-dev/wake').runTests({root:process.cwd(),patterns:['smoke.test.mjs']}).then(r=>{if(!r.success||r.counts.tests.passed!==1)process.exitCode=1})"
      - name: React browser and screenshot smoke
        if: matrix.node == 24 && matrix.browser_evidence != 'unavailable'
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          npm install --ignore-scripts --prefer-online "react@19.2.8" "react-dom@19.2.8"
          if [[ ! -f "$WAKE_RELEASE_BROWSER_PATH" ]]; then
            echo "::error::Reviewed system browser is unavailable at $WAKE_RELEASE_BROWSER_PATH on $RUNNER_OS/$RUNNER_ARCH"
            exit 1
          fi
          node -e "require('node:fs').writeFileSync('visual.browser.test.mjs',\"import React from 'react';import {test,expect} from '@crab-dev/wake/test';import {render,screen} from '@crab-dev/wake/test/react';test('published browser runtime',async()=>{await render(React.createElement('button',{'aria-label':'Ready',style:{width:120,height:48}},'Ready'));expect(screen.getByRole('button',{name:'Ready'}).textContent).toBe('Ready');await expect(screen.getByRole('button',{name:'Ready'})).toMatchScreenshot('published-ready')})\\n\")"
          npx wake test visual.browser.test.mjs \
            --serial \
            --browser-path "$WAKE_RELEASE_BROWSER_PATH" \
            --reporter json \
            --output browser-result.json
          node "$GITHUB_WORKSPACE/scripts/check-system-browser-conformance.mjs" \
            --target "${{ matrix.platform }}" \
            --result browser-result.json > "$RUNNER_TEMP/wake-browser-evidence.json"
          npx wake test visual.browser.test.mjs --serial --browser-path "$WAKE_RELEASE_BROWSER_PATH"
      - name: Record reviewed browser unavailability
        if: matrix.node == 24 && matrix.browser_evidence == 'unavailable'
        shell: bash
        run: |
          node scripts/check-system-browser-conformance.mjs \
            --target "${{ matrix.platform }}" \
            --unavailable true > "$RUNNER_TEMP/wake-browser-evidence.json"
      - name: Prove stable browser readiness remains blocked
        if: matrix.node == 24
        shell: bash
        run: |
          node scripts/check-system-browser-conformance.mjs \
            --stable-readiness blocked > "$RUNNER_TEMP/wake-browser-stable-readiness.json"
      - name: Upload postpublish browser evidence
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-postpublish-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/wake-browser-evidence.json
            ${{ runner.temp }}/wake-browser-stable-readiness.json
          if-no-files-found: error

name: Release npm packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run versions:check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  build-native:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win32-x64-msvc
            package_dir: wake-win32-x64-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: darwin-x64
            package_dir: wake-darwin-x64
          - runner: macos-15
            target: aarch64-apple-darwin
            suffix: darwin-arm64
            package_dir: wake-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: npm ci --ignore-scripts
      - run: >-
          npx napi build --platform --release --strip
          --cwd crates/wake_node
          --output-dir ../../npm/wake
          --package-json-path ../../npm/wake/package.json
          --no-js --dts native.d.ts
          --target ${{ matrix.target }}
      - name: Stage platform package
        run: >-
          node -e "require('node:fs').copyFileSync(
          'npm/wake/wake.${{ matrix.suffix }}.node',
          'npm/${{ matrix.package_dir }}/wake.${{ matrix.suffix }}.node')"
      - run: node -e "require('node:fs').mkdirSync('artifacts', {recursive:true})"
      - run: npm run npm:pack:check
        env:
          WAKE_PACK_TARGETS: npm/${{ matrix.package_dir }}
      - run: npm pack ./npm/${{ matrix.package_dir }} --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.suffix }}
          path: artifacts/*.tgz
          if-no-files-found: error

  build-linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
            package_dir: wake-linux-x64-gnu
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64-gnu
            package_dir: wake-linux-arm64-gnu
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: >-
          npx napi build --platform --release --strip
          --cwd crates/wake_node
          --output-dir ../../npm/wake
          --package-json-path ../../npm/wake/package.json
          --no-js --dts native.d.ts
          --target ${{ matrix.target }}
      - name: Verify glibc baseline
        run: |
          highest="$(readelf --version-info npm/wake/wake.${{ matrix.suffix }}.node | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          test "$(printf '%s\n' "$highest" 'GLIBC_2.28' | sort -V | tail -1)" = 'GLIBC_2.28'
      - name: Run native binding on glibc 2.28
        run: WAKE_NATIVE_PATH="$PWD/npm/wake/wake.${{ matrix.suffix }}.node" node -e "console.log(require(process.env.WAKE_NATIVE_PATH).version())"
      - name: Stage platform package
        run: >-
          node -e "require('node:fs').copyFileSync(
          'npm/wake/wake.${{ matrix.suffix }}.node',
          'npm/${{ matrix.package_dir }}/wake.${{ matrix.suffix }}.node')"
      - run: mkdir -p artifacts
      - run: node -e "require('node:fs').mkdirSync('artifacts', {recursive:true})"
      - run: npm run npm:pack:check
        env:
          WAKE_PACK_TARGETS: npm/${{ matrix.package_dir }}
      - run: npm pack ./npm/${{ matrix.package_dir }} --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.suffix }}
          path: artifacts/*.tgz
          if-no-files-found: error

  pack-root:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: mkdir -p artifacts
      - run: npm run npm:pack:check
        env:
          WAKE_PACK_TARGETS: npm/wake
      - run: npm pack ./npm/wake --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-root
          path: artifacts/*.tgz
          if-no-files-found: error

  audit-tarballs:
    needs: [build-native, build-linux, pack-root]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: artifacts
          merge-multiple: true
      - name: Verify all immutable tarballs
        shell: bash
        run: |
          shopt -s nullglob
          archives=(artifacts/*.tgz)
          test "${#archives[@]}" -eq 6
          for archive in "${archives[@]}"; do
            list="$(tar -tzf "$archive")"
            grep -qx 'package/package.json' <<<"$list"
            grep -qx 'package/LICENSE-MIT' <<<"$list"
            grep -qx 'package/LICENSE-APACHE' <<<"$list"
            grep -qx 'package/README.md' <<<"$list"
            native_count="$(grep -Ec '\.node$' <<<"$list" || true)"
            if [[ "$archive" == *crab-dev-wake-0.1.0.tgz ]]; then
              test "$native_count" -eq 0
              test "$(stat -c%s "$archive")" -le 524288
            else
              test "$native_count" -eq 1
              test "$(stat -c%s "$archive")" -le 15728640
            fi
            version="$(tar -xOzf "$archive" package/package.json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
            test "$version" = '0.1.0'
          done
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: artifacts/*.tgz

  publish:
    needs: audit-tarballs
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - name: Publish platform packages first
        run: |
          for package in artifacts/*wake-{win32,linux,darwin}-*.tgz; do
            npm publish "$package" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish root package last
        run: npm publish artifacts/crab-dev-wake-0.1.0.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke-glibc-228:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Clean install on the minimum glibc baseline
        shell: bash
        run: |
          mkdir smoke
          cd smoke
          npm init -y
          npm install --ignore-scripts @crab-dev/wake@0.1.0
          npx wake --version
          node -e "console.log(require('@crab-dev/wake').version())"

  smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15, macos-15-intel, ubuntu-24.04-arm]
        node: [22.14.0, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
      - name: Clean registry install without build tools
        shell: bash
        run: |
          mkdir smoke
          cd smoke
          npm init -y
          npm install --ignore-scripts @crab-dev/wake@0.1.0
          node -e "let p=require('./package.json');p.scripts={'wake-smoke':'wake build'};require('node:fs').writeFileSync('package.json',JSON.stringify(p));require('node:fs').mkdirSync('src');require('node:fs').writeFileSync('wake.config.toml','[html]\nentry = \"src/index.js\"\n');require('node:fs').writeFileSync('src/index.js','export const value = 42\n')"
          npx @crab-dev/wake --version
          npx wake --version
          npm run wake-smoke
          node -e "require('@crab-dev/wake').build({cwd:process.cwd()}).then(r=>{if(!r.success)process.exitCode=1})"
